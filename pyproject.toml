[project]
name = "voicefit"
version = "0.1.0"
description = "Voice-first workout logger (Mistral Le Chonk London hackathon)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pytest",
    "mistralai",
    "mistralai-agents",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
